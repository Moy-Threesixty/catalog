<style>
/* Layout: brand header + category tabs, flavor filter chips, photo grid; tap opens a full-screen product sheet. Single brand theme (light) by choice. */
:root{
  --rose:#A3414A; --wine:#7A2E36; --ink:#3A2326; --muted:#8A7477;
  --blush:#F7E4E5; --tint:#FBF3F3; --line:#E9C9CC; --paper:#FFFFFF; --ivory:#FBF8F3;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--tint);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:16px;padding-block:14px 10px}
.logo{height:46px;width:auto;display:block}
.bar .spacer{flex:1}
.lang{display:flex;border:1.5px solid var(--rose);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:7px 14px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--rose)}
.lang button[aria-pressed="true"]{background:var(--rose);color:var(--paper)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:12px 16px 13px;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--wine);border-bottom-color:var(--rose)}
.tab .count{font-size:11px;background:var(--blush);color:var(--wine);border-radius:999px;padding:2px 8px;letter-spacing:0}
.tab .soon{font-size:10px;color:var(--muted);letter-spacing:.04em;font-weight:600;text-transform:none}

main{padding-block:22px 40px}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.intro h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0;color:var(--wine);text-wrap:balance}
.intro p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:48ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:var(--paper)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{border:0;background:var(--paper);border-radius:18px;padding:12px 12px 16px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line);transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(122,46,54,.45)}
.card .ph{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:var(--paper);border-radius:12px;overflow:hidden}
.card img{mix-blend-mode:multiply;width:86%;height:86%;object-fit:contain}
.card h3{margin:0;font-size:18px;font-weight:700;color:var(--wine);letter-spacing:-.01em}
.card .tl{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);line-height:1.25;min-width:0}
.card .badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);background:var(--blush);border-radius:999px;padding:4px 9px}

.pend{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:6px;background:radial-gradient(120% 90% at 50% 40%,var(--paper) 0%,var(--blush) 100%);border-radius:12px;color:var(--wine);text-align:center;padding:12px;position:relative;overflow:hidden}
.pend .cam{position:relative;width:38%;max-width:84px;color:var(--rose)}
.pend .cam svg{width:100%;height:auto;display:block}
.pend .steam{display:block;width:46%;margin:0 auto 4px;color:var(--rose)}
.pend .steam path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;opacity:.45;animation:steam 3s ease-in-out infinite}
.pend .steam path:nth-child(2){animation-delay:1s}.pend .steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.7;transform:translateY(-3px)}}
.pend .pt{font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.2vw,22px);line-height:1.1;margin-top:10px}
.pend .ps{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.pend .pn{display:none;font-size:15px;line-height:1.45;color:var(--ink);max-width:30ch;margin-top:8px}
.stage .pend{min-height:320px;border-radius:18px}
.stage .pend .pt{font-size:30px}.stage .pend .ps{font-size:12px}.stage .pend .pn{display:block}
.card .ph .season + .pend{padding-top:44px}
.group{margin-top:34px;display:grid;gap:14px}
.group header{display:grid;gap:4px;max-width:62ch}
.group .eb{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.group h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(26px,3.4vw,34px);line-height:1.05;margin:0;color:var(--wine)}
.group p{margin:2px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.soonbox{background:var(--paper);border-radius:22px;padding:48px 24px;text-align:center;display:grid;gap:10px;justify-items:center;border:1.5px dashed var(--line)}
.soonbox h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:40px;margin:0;color:var(--wine)}
.soonbox p{margin:0;color:var(--muted);max-width:46ch;line-height:1.5}
.dots{display:flex;gap:9px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--rose);display:block}

.foot{color:var(--muted);font-size:13px;text-align:center;padding-block:10px 24px;letter-spacing:.04em}

/* product sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(58,35,38,.42);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);border-radius:24px;width:min(1080px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1.05fr 1fr;position:relative}
.stage{background:var(--ivory);display:grid;grid-template-rows:1fr auto;gap:14px;padding:26px;min-height:420px;border-radius:24px 0 0 24px}
.stage .imgbox{display:grid;place-items:center;min-height:0;position:relative}
.card .ph{position:relative}
.season{position:absolute;top:10px;left:10px;z-index:1;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1;letter-spacing:.01em;color:var(--wine);
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:6px 12px 7px;pointer-events:none}
.season::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rose);margin-right:7px;vertical-align:middle;transform:translateY(-1px)}
.stage .season{top:0;left:0;font-size:18px;padding:8px 15px 9px}
.season.low{top:auto;bottom:6%;left:50%;transform:translateX(-50%);white-space:nowrap}
.stage .season.low{top:auto;bottom:4%}
.seasonnote{background:var(--ivory);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45}
.seasonnote b{color:var(--wine);letter-spacing:.04em}
.stage img{mix-blend-mode:multiply;max-width:100%;max-height:min(56vh,520px);object-fit:contain;transition:opacity .2s}
.view{justify-self:center;display:flex;background:var(--paper);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.view button{border:0;background:transparent;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.view button[aria-pressed="true"]{background:var(--rose);color:var(--paper)}
.info{padding:30px 30px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.info .cat{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.info h2{margin:0;font-size:clamp(32px,4vw,44px);line-height:1;color:var(--wine);letter-spacing:-.02em}
.info .tl{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted);margin-top:-6px}
.info .desc{font-size:18px;line-height:1.5;margin:0;color:var(--ink);max-width:44ch}
.inside{display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row dt{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.row dd{margin:0;font-size:16px;line-height:1.4}
.allergy{background:var(--blush);color:var(--wine);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45}
.allergy b{letter-spacing:.04em}
.nav{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.nav button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:13px;font-weight:700;color:var(--wine);font-size:14px}
.close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 2px 10px rgba(58,35,38,.18);font-size:22px;line-height:1;color:var(--wine);z-index:2}

@media (max-width:760px){
  .panel{grid-template-columns:1fr}
  .stage{border-radius:24px 24px 0 0;min-height:0;padding:18px}
  .stage img{max-height:42vh}
  .info{padding:20px 18px 18px}
  .row{grid-template-columns:96px 1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card h3{font-size:16px}
  .logo{height:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.pend .steam path{animation:none}}
</style>

P.forEach(p => { if (GROUP[p.id]) p.group = GROUP[p.id]; });
P.forEach(p => { if (p.id==='turtle_cheesecake') p.nuts = true; });
const PHOTOS={choc_strawberries:1,rect_r01:2,rect_r02:2,rect_r03:2,rect_r04:2,rect_r05:2,raspberry_cream_puff:2,strawberry_cream_puff:2,tres_leches_personal:2,blueberry_tart:2,fruit_tart:2,black_forest_pastry:1,apple_butter_pecan:2,carrot_cake:2,oreo_mousse:2,vanilla_raspberry:2,gender_reveal_cake:1,oreo_cheesecake:2,biscoff_cheesecake:2,tiramisu:1,pistachio_raspberry_mousse:2,ny_cheesecake:2,turtle_cheesecake:2,red_velvet_cake:2,vanilla_buttercream:2,chocolate_buttercream:2,chocolate_ganache:2,bts:2,strawberry_shortcake:2,strawberry_lovers_cake:2,
  creme_brulee:1,cannoli:1,eclair:1,lemon_bar:1,cake_pops:1};
P.forEach(p => { if (SEASONAL[p.id]) p.seasonal = true; if (PHOTOS[p.id]){ p.photo = true; p.views = PHOTOS[p.id]; } });


const BUILD = '202611102330';
let lang = 'es', cat = 'cupcakes', tag = null, current = -1, view = 'out', list = [];
try { const s = JSON.parse(localStorage.getItem('ytb-cat') || '{}'); if (s.lang) lang = s.lang; } catch(e) {}
const $ = id => document.getElementById(id);

function save(){ try { localStorage.setItem('ytb-cat', JSON.stringify({lang})); } catch(e) {} }

function renderTabs(){
  $('tabs').innerHTML = CATS.map(c => {
    const n = P.filter(p => p.cat === c).length;
    const extra = n ? `<span class="count">${n}</span>` : `<span class="soon">${T[lang].soon}</span>`;
    return `<button class="tab" role="tab" id="tab-${c}" aria-selected="${c===cat}" data-c="${c}">${T[lang].tabs[c]}${extra}</button>`;
  }).join('');
}
function renderChips(){
  const items = P.filter(p => p.cat === cat);
  const used = [...new Set(items.flatMap(p => p.tags))];
  const order = ['chocolate','fruit','creamy','caramel','kids'].filter(t => used.includes(t));
  $('chips').hidden = !items.length;
  $('chips').innerHTML = [`<button class="chip" id="chip-all" aria-pressed="${!tag}" data-t="">${T[lang].all}</button>`]
    .concat(order.map(t => `<button class="chip" id="chip-${t}" aria-pressed="${tag===t}" data-t="${t}">${T[lang].tags[t]}</button>`)).join('');
}
function renderGrid(){
  $('h1').textContent = T[lang].h1[cat];
  const items = P.filter(p => p.cat === cat);
  $('sub').textContent = T[lang].sub[cat] || '';
  list = items.filter(p => !tag || p.tags.includes(tag));
  if (!items.length){
    $('content').innerHTML = `<div class="soonbox"><div class="dots"><i></i><i></i><i></i></div><h2>${T[lang].soonTitle}</h2><p>${T[lang].soonText[cat]}</p></div>`;
    return;
  }
  if (cat === 'cakes') list = [...list.filter(p => !p.group), ...list.filter(p => p.group==='rect'), ...list.filter(p => p.group==='order'), ...list.filter(p => p.group==='sheet')];
  const card = (p,i) => `
    <button class="card" data-i="${i}" id="card-${p.id}">
      <div class="ph">${badge(p)}${p.photo===false ? pend(p) : `<img src="img/${p.id}-out.webp?v=${BUILD}" alt="${p.name}" loading="lazy">`}</div>
      <h3>${p.name}</h3>
      <div class="tl">${p[lang].tl}</div>
    </button>`;
  const idx = list.map((p,i) => [p,i]);
  let html = `<div class="grid">` + idx.filter(([p]) => !p.group).map(([p,i]) => card(p,i)).join('') + `</div>`;
  for (const g of ['rect','order','sheet']){
    const part = idx.filter(([p]) => p.group === g); if (!part.length) continue;
    const G = T[lang].groups[g];
    html += `<section class="group"><header><span class="eb">${G.e}</span><h2>${G.h}</h2><p>${G.p}</p></header><div class="grid">` + part.map(([p,i]) => card(p,i)).join('') + `</div></section>`;
  }
  $('content').innerHTML = html.replace('<div class="grid"></div>','');
}
function badge(p){ const t=T[lang]; return p.seasonal ? `<span class="season low">${t.season}</span>` : p.group && p.group!=='rect' ? `<span class="season">${t.order}</span>` : ''; }
const CAM = '<svg viewBox="0 0 48 40" aria-hidden="true"><rect x="3" y="9" width="42" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 9l3-5h10l3 5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="23" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>';
function pend(p){ const t=T[lang]; return `<div class="pend" title="${p.code}"><div class="cam"><svg class="steam" viewBox="0 0 40 16" aria-hidden="true"><path d="M10 15c-3-3 3-5 0-8s3-5 0-6"/><path d="M20 15c-3-3 3-5 0-8s3-5 0-6"/><path d="M30 15c-3-3 3-5 0-8s3-5 0-6"/></svg>${CAM}</div><div class="pt">${t.pending}</div><div class="ps">${t.pendSub}</div><div class="pn">${t.pendNote}</div></div>`; }
function renderAll(){
  document.documentElement.lang = lang;
  $('lang-es').setAttribute('aria-pressed', lang==='es'); $('lang-en').setAttribute('aria-pressed', lang==='en');
  renderTabs(); renderChips(); renderGrid();
  if (current >= 0) openP(current, true);
}
function openP(i, keepView){
  current = (i + list.length) % list.length;
  if (!keepView) view = 'out';
  const p = list[current], L = p[lang], t = T[lang];
  const has = p.photo !== false;
  $('p-img').hidden = !has; $('pend-box').hidden = has; $('pend-box').innerHTML = has ? '' : pend(p);
  document.querySelector('.view').hidden = !has || p.views === 1;
  const lo = p.cat === 'slices' ? t.in : p.views === 2 ? t.side : t.out, li = p.views === 2 ? t.top : t.in;
  if (has){ $('p-img').src = `img/${p.id}-${view}.webp?v=${BUILD}`; $('p-img').alt = `${p.name} — ${view==='out'?lo:li}`; }
  $('v-out').textContent = lo; $('v-in').textContent = li;
  $('v-out').setAttribute('aria-pressed', view==='out'); $('v-in').setAttribute('aria-pressed', view==='in');
  $('p-cat').textContent = t.catLabel[p.cat]; $('p-name').textContent = p.name; $('p-tl').textContent = L.tl; $('p-desc').textContent = L.d;
  const rows = ['base','fill','top','deco'].filter(k => L[k]).map(k => [t.rows[k], L[k]]);
  if (p.pickFlavor) rows.push([t.flavor, t.flavorVal]);
  if (p.sz) rows.push([t.rows.sz, p.sz[lang]]);
  if (p.group === 'sheet') rows.push([t.price, t.priceVal]);
  $('p-rows').innerHTML = rows.map(([a,b]) => `<div class="row"><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  const note = p.seasonal ? t.seasonNote : p.group==='order' ? t.orderNote : p.group==='sheet' ? t.sheetNote : '';
  $('p-season').hidden = !(p.seasonal || (p.group && p.group!=='rect')); $('p-season').classList.toggle('low', !!p.seasonal); $('p-season').textContent = p.seasonal ? t.season : t.order; $('p-seasonnote').hidden = !note; $('p-seasonnote').innerHTML = note;
  $('p-allergy').hidden = false; $('p-allergy').innerHTML = p.nuts ? t.allergy : t.allergyAll;
  $('prev').textContent = t.prev; $('next').textContent = t.next;
  $('sheet').hidden = false; document.body.style.overflow = 'hidden';
}
function closeP(){ $('sheet').hidden = true; current = -1; document.body.style.overflow = ''; }

document.addEventListener('click', e => {
  const tb = e.target.closest('.tab'); if (tb){ cat = tb.dataset.c; tag = null; renderAll(); return; }
  const ch = e.target.closest('.chip'); if (ch){ tag = ch.dataset.t || null; renderChips(); renderGrid(); return; }
  const cd = e.target.closest('.card'); if (cd){ openP(+cd.dataset.i); return; }
});
$('lang-es').onclick = () => { lang='es'; save(); renderAll(); };
$('lang-en').onclick = () => { lang='en'; save(); renderAll(); };
$('close').onclick = closeP;
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeP(); });
$('prev').onclick = () => openP(current - 1);
$('next').onclick = () => openP(current + 1);
$('v-out').onclick = () => { view='out'; openP(current, true); };
$('v-in').onclick = () => { view='in'; openP(current, true); };
document.addEventListener('keydown', e => {
  if ($('sheet').hidden) return;
  if (e.key === 'Escape') closeP();
  if (e.key === 'ArrowRight') openP(current + 1);
  if (e.key === 'ArrowLeft') openP(current - 1);
});
let sx = null;
$('sheet').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
$('sheet').addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 60) openP(current + (dx < 0 ? 1 : -1));
});
renderAll();
// Actualización automática: revisa si hay una versión nueva y recarga cuando no hay ninguna ficha abierta
(function(){
  let pending = false;
  async function check(){
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
      if (!r.ok) return;
      const v = (await r.json()).v;
      if (v && v !== BUILD) pending = v;
    } catch(e) {}
    reloadIfIdle();
  }
  function reloadIfIdle(){
    if (pending && $('sheet').hidden) location.replace(location.pathname + '?v=' + pending + location.hash);
  }
  setInterval(check, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  $('close').addEventListener('click', () => setTimeout(reloadIfIdle, 300));
  setTimeout(check, 3000);
})();
</script>
